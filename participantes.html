<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participantes — EventHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .btn-cancelar {
      background: #fff3e0;
      color: var(--warning);
      border: 1.5px solid var(--warning);
    }
    .btn-cancelar:hover {
      background: var(--warning);
      color: white;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo">Event<span>Hub</span></a>
      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">Início</a></li>
          <li><a href="eventos.html">Eventos</a></li>
          <li id="adminLink" style="display:none;"><a href="admin.html">Admin</a></li>
          <li><a href="meus-eventos.html">Meus Eventos</a></li>
          <li><a href="participantes.html">Minhas Inscrições</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
          <li id="userMenu"></li>
        </ul>
      </nav>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <h1 id="pageTitle">Área de <span>Participantes</span></h1>
      <p id="pageSubtitle">Todos os inscritos nos eventos da plataforma</p>
    </div>
  </section>

  <section class="dashboard">
    <div class="container">

      <div class="admin-toolbar">
        <input type="text" class="admin-search" id="buscaParticipante"
               placeholder="🔍 Pesquisar por nome, evento ou e-mail...">
        <span class="results-count"><strong id="totalParticipantes">0</strong> participante(s)</span>
      </div>
      <div class="participantes-grid" id="participantesGrid"></div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 EventHub. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (!Auth.proteger(false)) { /* redireciona */ }

    const sessao = Auth.getSessao();
    const isAdmin = sessao.tipo === 'admin';

    if (isAdmin) {
      document.getElementById('adminLink').style.display = '';
    } else {
      // Título amigável para qualquer usuário logado
      document.getElementById('pageTitle').innerHTML = 'Minhas <span>Inscrições</span>';
      document.getElementById('pageSubtitle').textContent =
        'Gerencie as inscrições que você fez nos eventos';
    }

    (function renderUserMenu() {
      const li = document.getElementById('userMenu');
      li.innerHTML = `
        <a href="#" id="logoutBtn" class="btn-login" title="Sair"
           style="display:flex;align-items:center;gap:0.5rem;background:transparent;border:1px solid var(--primary);">
          👤 ${sessao.nome || sessao.email.split('@')[0]}
          <span style="opacity:0.6;font-size:0.75rem;">(${sessao.tipo})</span> ✕
        </a>`;
      document.getElementById('logoutBtn').addEventListener('click', ev => {
        ev.preventDefault();
        if (confirm('Deseja sair da conta?')) {
          Auth.logout();
          mostrarToast('Sessão encerrada.', 'info', '👋');
          setTimeout(() => window.location.href = 'login.html', 500);
        }
      });
    })();

    function participantesVisiveis() {
      const todos = DB.getParticipantes();
      if (isAdmin) return todos;
      const meuEmail = sessao.email.toLowerCase();
      return todos.filter(p => p.email.toLowerCase() === meuEmail);
    }

    function render(busca = '') {
      const eventos = DB.getEventos();
      let lista = participantesVisiveis();

      if (busca) {
        const q = busca.toLowerCase();
        lista = lista.filter(p => {
          const ev = eventos.find(e => e.id === p.eventoId);
          return p.nome.toLowerCase().includes(q)
            || p.email.toLowerCase().includes(q)
            || (ev && ev.nome.toLowerCase().includes(q));
        });
      }

      document.getElementById('totalParticipantes').textContent = lista.length;
      const grid = document.getElementById('participantesGrid');

      if (!lista.length) {
        const msgVazia = isAdmin
          ? 'Ainda não há inscrições para exibir.'
          : 'Você ainda não se inscreveu em nenhum evento.';
        const btnVazio = isAdmin
          ? ''
          : `<a href="eventos.html" class="btn btn-primary" style="margin-top:1rem;">📅 Explorar eventos</a>`;
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <span class="icon">${isAdmin ? '👥' : '🎟️'}</span>
            <h3>${isAdmin ? 'Nenhum participante encontrado' : 'Nenhuma inscrição ainda'}</h3>
            <p>${msgVazia}</p>
            ${btnVazio}
          </div>`;
        return;
      }

      grid.innerHTML = lista.map(p => {
        const ev = eventos.find(e => e.id === p.eventoId);
        const iniciais = p.nome.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
        return `
          <div class="participante-card">
            <div class="participante-header">
              <div class="participante-avatar">${iniciais}</div>
              <div>
                <div class="participante-nome">${p.nome}</div>
                <div class="participante-evento">${p.email}</div>
              </div>
            </div>
            <div style="font-size:0.88rem; color:var(--gray-700);">
              <strong>Evento:</strong> ${ev ? ev.nome : 'Removido'}<br>
              <strong>Data do evento:</strong> ${ev ? formatarData(ev.data) : '-'}<br>
              <strong>Telefone:</strong> ${p.telefone}
            </div>
            <div class="participante-info">
              ${isAdmin
                ? `<button class="btn btn-danger btn-sm" onclick="removerParticipante(${p.id})">🗑 Remover</button>`
                : `<div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                     <a href="evento.html?id=${p.eventoId}" class="btn btn-outline btn-sm">Ver evento</a>
                     <button class="btn btn-cancelar btn-sm" onclick="cancelarInscricao(${p.id}, '${ev ? ev.nome.replace(/'/g, "\\'") : 'Evento'}')">✕ Cancelar</button>
                   </div>`}
            </div>
          </div>`;
      }).join('');
    }

    function removerParticipante(id) {
      if (!isAdmin) return;
      const p = DB.getParticipantes().find(x => x.id === id);
      if (!p) return;
      const ev = DB.getEventos().find(e => e.id === p.eventoId);

      if (confirm('Remover este participante?')) {
        DB.deleteParticipante(id);
        mostrarToast('Participante removido.', 'warning', '🗑');

        if (typeof registrarLog === 'function') {
          registrarLog('Excluir Participante', `O admin removeu a inscrição de "${p.nome}" no evento "${ev ? ev.nome : 'Removido'}".`);
        }

        render(document.getElementById('buscaParticipante').value);
      }
    }

    function cancelarInscricao(id, nomeEvento) {
      const participante = DB.getParticipantes().find(p => p.id === id);
      if (!participante) return;

      if (!isAdmin && participante.email.toLowerCase() !== sessao.email.toLowerCase()) {
        mostrarToast('Você só pode cancelar suas próprias inscrições.', 'error', '❌');
        return;
      }

      if (!confirm(
        `❌ Cancelar inscrição?\n\n` +
        `Evento: ${nomeEvento}\n` +
        `Participante: ${participante.nome}\n\n` +
        `Essa ação não pode ser desfeita.`
      )) return;

      DB.deleteParticipante(id);
      mostrarToast(`Inscrição em "${nomeEvento}" cancelada.`, 'warning', '🗑');

      if (typeof registrarLog === 'function') {
        registrarLog('Cancelar Inscrição', `O participante ${participante.email} cancelou a inscrição no evento "${nomeEvento}".`);
      }

      render(document.getElementById('buscaParticipante').value);
    }

    document.getElementById('buscaParticipante')
      .addEventListener('input', e => render(e.target.value));
    render();
  </script>
</body>
</html>
