<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Evento — EventHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/eventos.css">
  <style>
    /* Fallback visual caso o JS não carregue */
    .loading-placeholder {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--gray-600);
    }
    .loading-placeholder .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--gray-200);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo">Event<span>Hub</span></a>
      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">Início</a></li>
          <li><a href="eventos.html" class="active">Eventos</a></li>
          <li id="adminLink" style="display:none;"><a href="admin.html">Admin</a></li>
          <li><a href="participantes.html">Participantes</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
          <li id="userMenu"></li>
        </ul>
      </nav>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <section class="event-detail">
    <div class="container">
      <!-- Placeholder inicial (mostra enquanto o JS carrega) -->
      <div id="detalheEvento">
        <div class="loading-placeholder">
          <div class="spinner"></div>
          <p>Carregando evento...</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 EventHub. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <!-- ===== SCRIPTS NA ORDEM CORRETA ===== -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    /* ============================================================
       PÁGINA DE DETALHES DO EVENTO
       ============================================================ */
    (function () {
      const container = document.getElementById('detalheEvento');
      if (!container) return;

      /* ---------- 1) Menu do usuário ---------- */
      try {
        const sessao = Auth.getSessao();
        if (sessao) {
          const li = document.getElementById('userMenu');
          if (li) {
            li.innerHTML = `
              <a href="#" id="logoutBtn" class="btn-login" title="Sair"
                 style="display:flex;align-items:center;gap:0.5rem;background:transparent;border:1px solid var(--primary);">
                👤 ${sessao.nome || sessao.email.split('@')[0]} ✕
              </a>`;
            document.getElementById('logoutBtn').addEventListener('click', ev => {
              ev.preventDefault();
              if (confirm('Deseja sair da conta?')) {
                Auth.logout();
                location.href = 'login.html';
              }
            });
          }
          if (sessao.tipo === 'admin') {
            const adminLink = document.getElementById('adminLink');
            if (adminLink) adminLink.style.display = '';
          }
        }
      } catch (err) {
        console.warn('Sessão indisponível:', err);
      }

      /* ---------- 2) Lê o ID da URL ---------- */
      const params = new URLSearchParams(location.search);
      const idParam = params.get('id');
      const id = parseInt(idParam);

      if (!idParam || isNaN(id)) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="icon">🔍</span>
            <h3>Nenhum evento selecionado</h3>
            <p>Selecione um evento na lista para ver os detalhes.</p>
            <a href="eventos.html" class="btn btn-primary" style="margin-top:1rem;">← Voltar aos eventos</a>
          </div>`;
        return;
      }

      /* ---------- 3) Busca o evento ---------- */
      let evento;
      try {
        evento = DB.getEventos().find(e => e.id === id);
      } catch (err) {
        console.error('Erro ao buscar evento:', err);
      }

      if (!evento) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="icon">❌</span>
            <h3>Evento não encontrado</h3>
            <p>O evento que você procura não existe ou foi removido.</p>
            <a href="eventos.html" class="btn btn-primary" style="margin-top:1rem;">← Voltar aos eventos</a>
          </div>`;
        return;
      }

      /* ---------- 4) Calcula estado ---------- */
      const inscritos = DB.getParticipantes().filter(p => p.eventoId === evento.id).length;
      const vagasRestantes = evento.vagas - inscritos;
      const lotado = vagasRestantes <= 0;
      const prog = Array.isArray(evento.programacao) ? evento.programacao : [];

      const sessao = Auth.getSessao();
      const jaInscrito = sessao && sessao.tipo === 'participante' &&
        DB.getParticipantes().some(p =>
          p.eventoId === evento.id && p.email.toLowerCase() === sessao.email.toLowerCase()
        );

      /* ---------- 5) Botão de inscrição ---------- */
      let botaoInscricao;
      if (jaInscrito) {
        botaoInscricao = `
          <span class="badge" style="margin-bottom:1rem; display:inline-flex;">✅ Você já está inscrito</span>
          <a href="participantes.html" class="btn btn-outline" style="width:100%;">Ver minhas inscrições</a>`;
      } else if (lotado) {
        botaoInscricao = `
          <span class="badge full" style="margin-bottom:1rem; display:inline-flex;">EVENTO LOTADO</span>
          <button class="btn btn-primary" style="width:100%;" disabled>Esgotado</button>`;
      } else {
        botaoInscricao = `
          <a href="inscricao.html?eventoId=${evento.id}" class="btn btn-primary" style="width:100%;">🎟️ Inscrever-se</a>`;
      }

      /* ---------- 6) Programa (fallback) ---------- */
      const programacaoHTML = prog.length
        ? prog.map(p => `
            <div class="programacao-item">
              <span class="time">${p.hora}</span>
              <span>${p.titulo}</span>
            </div>`).join('')
        : '<p style="color:var(--gray-600);">Programação em breve.</p>';

      /* ---------- 7) Renderiza ---------- */
      container.innerHTML = `
        <div class="event-detail-grid">
          <div class="event-detail-content">
            <div class="event-detail-hero" style="background:${evento.cor || 'linear-gradient(135deg,#1a1a2e,#0f3460)'}">
              <span>${evento.imagem || '📌'}</span>
            </div>
            <h1>${evento.nome}</h1>
            <p style="color:var(--gray-600); margin-bottom:1.5rem; line-height:1.7;">${evento.descricao}</p>

            <div class="event-detail-meta">
              <div class="meta-item">
                <span class="icon">📅</span>
                <div><div class="label">Data</div><div class="value">${formatarData(evento.data)}</div></div>
              </div>
              <div class="meta-item">
                <span class="icon">🕒</span>
                <div><div class="label">Horário</div><div class="value">${evento.horario}</div></div>
              </div>
              <div class="meta-item">
                <span class="icon">📍</span>
                <div><div class="label">Local</div><div class="value">${evento.local}</div></div>
              </div>
              <div class="meta-item">
                <span class="icon">🏷️</span>
                <div><div class="label">Categoria</div><div class="value">${evento.categoria}</div></div>
              </div>
              <div class="meta-item">
                <span class="icon">👤</span>
                <div><div class="label">Responsável</div><div class="value">${evento.responsavel || '-'}</div></div>
              </div>
              <div class="meta-item">
                <span class="icon">👥</span>
                <div><div class="label">Vagas</div><div class="value">${evento.vagas}</div></div>
              </div>
            </div>

            <div class="programacao">
              <h3>📋 Programação</h3>
              ${programacaoHTML}
            </div>
          </div>

          <aside>
            <div class="sidebar-card">
              <h3>Inscrição</h3>
              <div class="vagas-info">
                <div class="count">${lotado ? '0' : vagasRestantes}</div>
                <div class="label">vagas restantes de ${evento.vagas}</div>
              </div>
              ${botaoInscricao}
            </div>
            <div class="sidebar-card">
              <h3>Compartilhe</h3>
              <p style="color:var(--gray-600); font-size:0.9rem; margin-bottom:0.8rem;">
                Convide seus amigos para este evento!
              </p>
              <button class="btn btn-outline" style="width:100%;" onclick="navigator.clipboard.writeText(location.href); mostrarToast('Link copiado!', 'success', '🔗')">
                📋 Copiar link
              </button>
            </div>
            <div class="sidebar-card">
              <a href="eventos.html" class="btn btn-outline" style="width:100%;">← Voltar aos eventos</a>
            </div>
          </aside>
        </div>`;
    })();
  </script>
</body>
</html>
