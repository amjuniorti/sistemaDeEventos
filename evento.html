<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Evento — EventHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/eventos.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo">Event<span>Hub</span></a>
      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">Início</a></li>
          <li><a href="eventos.html" class="active">Eventos</a></li>
          <li id="adminLink" style="display:none;"><a href="admin.html">Admin</a></li>
          <li><a href="participantes.html">Participantes</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
          <li id="userMenu"><a href="login.html" class="btn-login">Entrar</a></li>
        </ul>
      </nav>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <section class="event-detail">
    <div class="container" id="detalheEvento">
      <!-- Renderizado via JS -->
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom"><p>&copy; 2025 EventHub. Todos os direitos reservados.</p></div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('detalheEvento');
      const id = parseInt(new URLSearchParams(location.search).get('id'));

      if (!id) {
        container.innerHTML = `<div class="empty-state" style="text-align:center;"><h3>Evento não encontrado.</h3><a href="eventos.html" class="btn btn-primary" style="margin-top:1rem;">Voltar</a></div>`;
        return;
      }

      const evento = DB.getEventos().find(e => e.id === id);
      if (!evento) {
        container.innerHTML = `<div class="empty-state" style="text-align:center;"><h3>Evento não existe.</h3><a href="eventos.html" class="btn btn-primary" style="margin-top:1rem;">Voltar</a></div>`;
        return;
      }

      const imgUrl = obterImagemEvento(evento);
      const inscritos = DB.getParticipantes().filter(p => p.eventoId === evento.id).length;
      const vagasRestantes = evento.vagas - inscritos;
      const lotado = vagasRestantes <= 0;
      
      const sessao = Auth.getSessao();
      const jaInscrito = sessao && sessao.tipo === 'participante' && DB.getParticipantes().some(p => p.eventoId === evento.id && p.email.toLowerCase() === sessao.email.toLowerCase());

      let botao = '';
      if (jaInscrito) {
        botao = `<span class="badge" style="display:block;text-align:center;margin-bottom:1rem;">✅ Você já está inscrito</span><a href="participantes.html" class="btn btn-outline" style="width:100%;">Ver minhas inscrições</a>`;
      } else if (lotado) {
        botao = `<span class="badge full" style="display:block;text-align:center;margin-bottom:1rem;">EVENTO LOTADO</span><button class="btn btn-primary" style="width:100%;" disabled>Esgotado</button>`;
      } else if (!sessao || sessao.tipo !== 'participante') {
        // Se não estiver logado como participante, pede para fazer login/cadastro
        botao = `
          <p style="font-size:0.85rem; color:var(--gray-600); text-align:center; margin-bottom:1rem;">Faça login para se inscrever</p>
          <a href="login.html?redirect=inscricao.html?eventoId=${evento.id}" class="btn btn-primary" style="width:100%; margin-bottom:0.5rem;">🔒 Entrar / Cadastrar</a>
        `;
      } else {
        botao = `<a href="inscricao.html?eventoId=${evento.id}" class="btn btn-primary" style="width:100%;">🎟️ Inscrever-se</a>`;
      }

      container.innerHTML = `
        <div class="event-detail-grid">
          <div class="event-detail-content">
            <div class="event-detail-hero event-detail-hero-photo">
              <img src="${imgUrl}" class="img-cover" alt="${evento.nome}" onerror="this.src='${IMAGEM_FALLBACK}'">
              <span class="event-category-badge">${evento.categoria}</span>
            </div>
            <h1>${evento.nome}</h1>
            <p style="color:var(--gray-600); margin-bottom:1.5rem;">${evento.descricao}</p>
            
            <div class="event-detail-meta">
              <div class="meta-item"><span class="icon">📅</span><div><div class="label">Data</div><div class="value">${formatarData(evento.data)}</div></div></div>
              <div class="meta-item"><span class="icon">🕒</span><div><div class="label">Horário</div><div class="value">${evento.horario}</div></div></div>
              <div class="meta-item"><span class="icon">📍</span><div><div class="label">Local</div><div class="value">${evento.local}</div></div></div>
              <div class="meta-item"><span class="icon">👤</span><div><div class="label">Responsável</div><div class="value">${evento.responsavel || '-'}</div></div></div>
            </div>
          </div>
          
          <aside>
            <div class="sidebar-card" style="background:white; padding:1.5rem; border-radius:8px;">
              <h3>Inscrição</h3>
              <div style="margin-bottom:1rem;">
                <div style="font-size:2rem; font-weight:bold; color:var(--primary);">${lotado ? '0' : vagasRestantes}</div>
                <div style="font-size:0.8rem; color:var(--gray-500);">vagas restantes de ${evento.vagas}</div>
              </div>
              ${botao}
            </div>
          </aside>
        </div>
      `;
    });
  </script>
</body>
</html>
