<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seja um Contratante — EventHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo">Event<span>Hub</span></a>
      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">Início</a></li>
          <li><a href="eventos.html">Eventos</a></li>
          <li id="userMenu"><a href="login.html" class="btn-login">Entrar</a></li>
        </ul>
      </nav>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <h1>Seja um <span>Contratante</span></h1>
      <p>Crie sua conta para organizar e gerenciar seus próprios eventos</p>
    </div>
  </section>

  <section style="padding:3rem 0; flex:1;">
    <div class="container" style="max-width:500px;">
      <form class="form-card" id="formContratante" novalidate>
        <div class="form-group">
          <label for="email">E-mail Corporativo <span class="req">*</span></label>
          <input type="email" id="email" placeholder="seu@email.com" required>
          <span class="error-msg">E-mail inválido.</span>
        </div>
        <div class="form-group">
          <label for="senha">Senha <span class="req">*</span></label>
          <input type="password" id="senha" placeholder="Mínimo 4 caracteres" required>
          <span class="error-msg">Mínimo 4 caracteres.</span>
        </div>
        <div class="form-group">
          <label for="senha2">Confirmar Senha <span class="req">*</span></label>
          <input type="password" id="senha2" placeholder="Repita a senha" required>
          <span class="error-msg">As senhas não coincidem.</span>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">✨ Criar Conta de Contratante</button>
        
        <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--gray-600);">
          Já tem conta? <a href="login.html" style="color:var(--primary); font-weight:bold;">Faça Login</a>
        </p>
      </form>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/validacao.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('formContratante');
      
      form.querySelectorAll('input').forEach(c =>
        c.addEventListener('input', () => Validacao.limparErro(c))
      );

      form.addEventListener('submit', e => {
        e.preventDefault();
        Validacao.limparTodos(form);

        const email = document.getElementById('email');
        const senha = document.getElementById('senha');
        const senha2 = document.getElementById('senha2');

        let ok = true;
        if (!Validacao.emailValido(email.value.trim())) { Validacao.aplicarErro(email, 'E-mail inválido.'); ok = false; }
        if (senha.value.length < 4) { Validacao.aplicarErro(senha, 'Mínimo 4 caracteres.'); ok = false; }
        if (senha.value !== senha2.value) { Validacao.aplicarErro(senha2, 'As senhas não coincidem.'); ok = false; }

        if (!ok) { mostrarToast('Corrija os campos.', 'error', '⚠️'); return; }

        // Chama a função de cadastro passando o tipo 'contratante'
        const resultado = Auth.cadastrar(email.value.trim(), senha.value, 'contratante');
        
        if (!resultado.sucesso) {
          mostrarToast(resultado.mensagem, 'error', '❌');
          return;
        }

        mostrarToast('Conta criada com sucesso! Faça login.', 'success', '🎉');
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      });
    });
  </script>
</body>
</html>
