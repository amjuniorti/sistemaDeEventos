<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Negado — EventHub</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .negado-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-2) 50%, var(--dark-3) 100%);
    }
    .negado-card {
      background: white;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 25px 80px rgba(0,0,0,0.3);
      animation: negadoIn 0.4s ease;
    }
    @keyframes negadoIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .negado-icon {
      font-size: 4.5rem;
      display: block;
      margin-bottom: 1rem;
    }
    .negado-title {
      font-size: 1.6rem;
      color: var(--dark);
      margin-bottom: 0.6rem;
    }
    .negado-desc {
      color: var(--gray-600);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.7;
    }
    .negado-actions {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .negado-user {
      background: var(--gray-50);
      padding: 0.8rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--gray-700);
      margin-bottom: 1.5rem;
      border-left: 4px solid var(--warning);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="logo">Event<span>Hub</span></a>
    </div>
  </header>

  <div class="negado-wrapper">
    <div class="negado-card">
      <span class="negado-icon">🚫</span>
      <h1 class="negado-title">Acesso Negado</h1>
      <p class="negado-desc">
        Você está logado como <strong>participante</strong>, mas esta página é
        restrita a <strong>administradores</strong>.
      </p>

      <div class="negado-user" id="infoUsuario"></div>

      <div class="negado-actions">
        <a href="participantes.html" class="btn btn-primary" style="width:100%;">
          👥 Ver minhas inscrições
        </a>
        <a href="eventos.html" class="btn btn-outline" style="width:100%;">
          📅 Explorar eventos
        </a>
        <a href="index.html" class="btn btn-outline" style="width:100%;">
          🏠 Voltar à página inicial
        </a>
        <button class="btn btn-danger" id="logoutBtn" style="width:100%;">
          🚪 Sair da conta
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const sessao = Auth.getSessao();
    if (sessao) {
      document.getElementById('infoUsuario').innerHTML =
        `Logado como: <strong>${sessao.email}</strong><br>Perfil: <strong>${sessao.tipo}</strong>`;
    }
    document.getElementById('logoutBtn').addEventListener('click', () => {
      Auth.logout();
      location.href = 'login.html';
    });
  </script>
</body>
</html>
